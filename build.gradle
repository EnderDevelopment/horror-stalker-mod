plugins {
  id 'java'
  id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group 'com.example'
version '1.0'

repositories {
  mavenCentral()
}

dependencies {
  implementation 'net.minecraftforge:forge:1.19.2-43.1.0'
  implementation 'net.minecraftforge:minecraft:1.19.2-43.1.0'
}

jar {
  archiveFileName = "StalkerMod-1.0.jar"
}

shadowJar {
  archiveFileName = "StalkerMod-1.0-all.jar"
}
